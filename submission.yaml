submission:
  title: "CareerSetu AI — PM Internship Recommender"   # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Internship platforms rely on rigid keyword search, causing qualified
    candidates to be filtered out over minor wording differences and leaving
    recruiters to sift through mismatched applications with no explainable
    feedback for candidates who are rejected.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    CareerSetu AI is a hybrid AI matching engine that combines NLP, fuzzy
    string matching, geospatial proximity analysis, and an LLM to generate
    personalized, explainable, and diverse internship recommendations for
    candidates while surfacing only high-probability matches to employers.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Hybrid skill matching using TF-IDF semantic similarity + RapidFuzz fuzzy matching"
    - "Geospatial proximity scoring via Haversine distance, aware of remote/hybrid/on-site work modes"
    - "Gamification boost from verified candidate certificates matched against required skills"
    - "LLM-generated explainable recommendations (IBM Watsonx) with deterministic template fallback"
    - "MMR-based diversity re-ranking to avoid duplicate company/sector recommendations"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite", "TailwindCSS"]
    ibm_technologies: ["watsonx.ai (Granite-13B-instruct-v2)"]
    databases: ["SQLite", "PostgreSQL (Supabase)"]
    other: ["scikit-learn", "RapidFuzz", "Geopy", "Nominatim (OpenStreetMap)", "Pytest"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The explainable AI layer — every match comes with a human-readable
    "why," and the system gracefully falls back to deterministic templates
    within a strict 3-second timeout so the user experience never breaks
    even if the LLM call fails.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Geocoding relies on a free Nominatim endpoint, which can be rate-limited
    at scale. The recruiter-side analytics dashboard and resume-parsing
    auto-fill are planned but not yet implemented.

